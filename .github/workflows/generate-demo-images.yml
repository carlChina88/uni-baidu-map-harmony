name: Generate demo images

on:
  push:
    branches:
      - master
      - docs-phone-demo-screenshots-use-this
    paths:
      - scripts/generate-demo-images.py
      - .github/workflows/generate-demo-images.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --disable-pip-version-check pillow

      - name: Generate phone demo screenshots
        run: python scripts/generate-demo-images.py

      - name: Commit generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/images
          if git diff --cached --quiet; then
            echo "Demo images are already up to date."
            exit 0
          fi
          git commit -m "docs: replace previews with phone demo screenshots"
          git push origin "HEAD:${GITHUB_REF_NAME}"
