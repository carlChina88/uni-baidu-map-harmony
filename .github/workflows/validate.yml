name: Validate source

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate source layout
        run: node scripts/verify-sdk.mjs
